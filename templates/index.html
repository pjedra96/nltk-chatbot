<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PyBot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <div class="chat">
      <header class="chat-header">
        <div class="avatar" aria-hidden="true">P</div>
        <div>
          <h1>PyBot</h1>
          <p class="status"><span class="dot"></span>Online</p>
        </div>
      </header>

      <main id="messages" class="messages" aria-live="polite">
        <div class="message bot">
          <div class="bubble">Hi! I'm PyBot from Biodata Ltd. Ask me about the company, ask for a fun fact, or just chat. You can tell me what to call you by saying "call me ...".</div>
        </div>
      </main>

      <form id="chatForm" class="composer" autocomplete="off">
        <textarea id="txt" rows="1" placeholder="Type a message…" aria-label="Message" autofocus></textarea>
        <button type="submit" id="send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
        </button>
      </form>
    </div>

    <script>
      const form = document.getElementById('chatForm');
      const input = document.getElementById('txt');
      const messages = document.getElementById('messages');

      function addMessage(text, who) {
        const row = document.createElement('div');
        row.className = 'message ' + who;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        row.appendChild(bubble);
        messages.appendChild(row);
        messages.scrollTop = messages.scrollHeight;
        return row;
      }

      function showTyping() {
        const row = document.createElement('div');
        row.className = 'message bot';
        row.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';
        messages.appendChild(row);
        messages.scrollTop = messages.scrollHeight;
        return row;
      }

      function resize() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 140) + 'px';
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const message = input.value.trim();
        if (!message) return;

        addMessage(message, 'user');
        input.value = '';
        resize();
        input.focus();

        const typing = showTyping();
        try {
          const res = await fetch('/message?' + new URLSearchParams({ message: message }));
          const data = await res.text();
          typing.remove();
          addMessage(res.ok ? data : 'Sorry, something went wrong on my end.', 'bot');
        } catch (err) {
          typing.remove();
          addMessage('Sorry, I could not reach the server.', 'bot');
        }
      });

      // ENTER sends the message, SHIFT + ENTER adds a new line
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      input.addEventListener('input', resize);
    </script>
  </body>
</html>
